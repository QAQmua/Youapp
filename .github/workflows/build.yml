name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: 解压并编译打包
        run: |
          # 1. 安全解压所有 zip（彻底兼容文件名里的空格和中文特殊符号）
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;

          # 2. 定位 Package.swift 所在文件夹
          PKG_FILE=$(find . -name "Package.swift" -not -path "*/.*" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "错误：解压后未找到 Package.swift"
            exit 1
          fi
          
          PKG_DIR=$(dirname "$PKG_FILE")
          echo "成功进入项目目录: $PKG_DIR"
          cd "$PKG_DIR"

          # 3. 自动匹配 Scheme (You)
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then
            SCHEME="You"
          fi
          echo "编译使用的 Scheme: $SCHEME"

          # 4. 免证书直接构建
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # 5. 生成 IPA
          cd "$GITHUB_WORKSPACE"
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" | head -n 1)
          fi
          echo "打包目标: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r You.ipa Payload
          echo "恭喜！IPA 封装成功！"

      - name: 上传 IPA 供下载
        uses: actions/upload-artifact@v4
        with:
          name: You-App-IPA
          path: You.ipa
